# leptiq configuration. Every key can also be set via environment variables
# prefixed with LEPTIQ_ (nested keys use "__", e.g. LEPTIQ_SMTP__HOST).

bind = "0.0.0.0:8080"
# SQLite:   "sqlite://data/leptiq.db?mode=rwc"
# Postgres: "postgres://leptiq:secret@localhost/leptiq"
database_url = "sqlite://data/leptiq.db?mode=rwc"
public_url = "https://pass.example.com"
# Users get addresses on this domain: <username>@<mail_domain>
mail_domain = "example.com"
# "open", "invite" (codes from `leptiq admin invite`) or "closed"
signup = "open"
require_app_version = true
data_dir = "data"
cors_origins = ["*"]
storage_quota_bytes = 10737418240
webauthn_rp_id = "example.com"
# Optional: your own clearsigned SRP modulus (requires patched clients).
# srp_modulus_file = "modulus.asc"

[pass.alias]
enabled = false
domains = ["alias.example.com"]
smtp_listen = "0.0.0.0:2525"

[smtp]
host = ""
port = 587
username = ""
password = ""
from = "leptiq@example.com"
security = "starttls"
