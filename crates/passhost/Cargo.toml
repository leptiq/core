[package]
name = "passhost"
description = "Self-hostable, open-source server for Proton Pass clients"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "passhost"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
hex = "0.4"
hmac = "0.12"
proton-srp = "0.8.4"
pgp = "0.21"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
totp-rs = { version = "5", features = ["gen_secret"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tempfile = "3"
aes-gcm = "0.10"
